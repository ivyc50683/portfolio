<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery — Ivy Chan</title>
    <style>
      body {
        background: #fff;
        color: #222;
        font: 1rem/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        margin: 0;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      .header {
        display: flex;
        align-items: baseline;
        gap: 1.5rem;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: bold;
        margin: 0;
      }

      a.back {
        font-size: 0.9rem;
        color: #222;
        text-decoration: underline;
      }

      a.back:hover { color: #555; }

      .grid {
        position: relative;
      }

      .grid img {
        position: absolute;
        display: block;
        height: auto;
      }

      .grid img:not([data-wide]) {
        max-height: 420px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Gallery</h1>
        <a class="back" href="draft.html">← Back</a>
      </div>

      <div class="grid">
        <img src="assets/accessible_2.png" alt="Accessible Indoor Map detail" />
        <img src="assets/accessible_3.png" alt="Accessible Indoor Map detail" data-wide />
        <img src="assets/accessible_4.png" alt="Accessible Indoor Map detail" />
        <img src="assets/accessible_5.gif" alt="Accessible Indoor Map animation" />
        <img src="assets/indoor_map_app.gif" alt="Indoor Map App" data-wide />
        <img src="assets/indoor_1.png" alt="Indoor Map detail" />
        <img src="assets/indoor_3.png" alt="Indoor Map detail" data-wide />
        <img src="assets/indoor_4.gif" alt="Indoor Map animation" />
        <img src="assets/indoor_5.gif" alt="Indoor Map animation" />
        <img src="assets/map_management_portal.gif" alt="Map Management Portal" data-wide />
        <img src="assets/management_1.png" alt="Map Management Portal detail" data-wide />
        <img src="assets/management_2.png" alt="Map Management Portal detail" />
        <img src="assets/management_3.png" alt="Map Management Portal detail" data-wide />
        <img src="assets/management_5.png" alt="Map Management Portal detail" data-wide />
        <img src="assets/management_6.gif" alt="Map Management Portal animation" data-wide />
        <img src="assets/map_production_app.png" alt="Map Production App" data-wide />
        <img src="assets/production_1.png" alt="Map Production detail" data-wide />
        <img src="assets/production_2.png" alt="Map Production detail" data-wide />
        <img src="assets/production_4.png" alt="Map Production detail" data-wide />
        <img src="assets/production_6.png" alt="Map Production detail" />
        <img src="assets/production_7.png" alt="Map Production detail" data-wide />
        <img src="assets/production_8.gif" alt="Map Production animation" />
        <img src="assets/customer_journey_map.png" alt="Customer Journey Map" data-wide />
        <img src="assets/journey_2.png" alt="Customer Journey detail" data-wide />
        <img src="assets/mental_1.png" alt="Mental Health App detail" />
        <img src="assets/mental_2.png" alt="Mental Health App detail" />
        <img src="assets/retail_1.png" alt="Retail Mall App detail" />
        <img src="assets/retail_2.png" alt="Retail Mall App detail" data-wide />
        <img src="assets/retail_3.png" alt="Retail Mall App detail" data-wide />
        <img src="assets/retail_4.gif" alt="Retail Mall App animation" />
      </div>
    </div>

    <script>
      const GAP = 12;
      const MAX_PORTRAIT_H = 420;

      function getCols() {
        if (window.innerWidth <= 400) return 1;
        if (window.innerWidth <= 640) return 2;
        return 3;
      }

      function layout() {
        const grid = document.querySelector('.grid');
        const imgs = Array.from(grid.querySelectorAll('img'));
        const cols = getCols();
        const gridWidth = grid.offsetWidth;
        const colWidth = (gridWidth - GAP * (cols - 1)) / cols;
        const colHeights = new Array(cols).fill(0);

        imgs.forEach(img => {
          const isWide = img.hasAttribute('data-wide');
          const span = (isWide && cols >= 2) ? Math.min(2, cols) : 1;
          const w = colWidth * span + GAP * (span - 1);
          const naturalH = (img.naturalHeight / img.naturalWidth) * w;
          const h = isWide ? naturalH : Math.min(naturalH, MAX_PORTRAIT_H);

          // find the column position with the lowest combined height
          let bestCol = 0;
          let minH = Infinity;
          for (let i = 0; i <= cols - span; i++) {
            const top = Math.max(...colHeights.slice(i, i + span));
            if (top < minH) { minH = top; bestCol = i; }
          }

          img.style.left  = (bestCol * (colWidth + GAP)) + 'px';
          img.style.top   = minH + 'px';
          img.style.width = w + 'px';

          const bottom = minH + h + GAP;
          for (let i = bestCol; i < bestCol + span; i++) colHeights[i] = bottom;
        });

        grid.style.height = Math.max(...colHeights) + 'px';
      }

      window.addEventListener('load', () => {
        layout();
        window.addEventListener('resize', layout);
      });
    </script>
  </body>
</html>
