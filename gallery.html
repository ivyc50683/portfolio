<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery — Ivy Chan</title>
    <style>
      body {
        background: #fff;
        color: #222;
        font: 1rem/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        margin: 0;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      .header {
        display: flex;
        align-items: baseline;
        gap: 1.5rem;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: bold;
        margin: 0;
      }

      a.back {
        font-size: 0.9rem;
        color: #222;
        text-decoration: underline;
      }

      a.back:hover {
        color: #555;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
        align-items: start;
        grid-auto-flow: dense;
      }

      .grid img {
        display: block;
        width: 100%;
        height: auto;
      }

      .grid img.wide {
        grid-column: span 2;
        height: 300px;
        object-fit: cover;
      }

      @media (max-width: 640px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid img.wide {
          grid-column: span 2;
        }
      }

      @media (max-width: 400px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .grid img.wide {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Gallery</h1>
        <a class="back" href="draft.html">← Back</a>
      </div>

      <div class="grid">
        <img src="assets/accessible_2.png" alt="Accessible Indoor Map detail" />
        <img src="assets/accessible_3.png" alt="Accessible Indoor Map detail" />
        <img src="assets/accessible_4.png" alt="Accessible Indoor Map detail" />
        <img src="assets/accessible_5.gif" alt="Accessible Indoor Map animation" />
        <img src="assets/indoor_map_app.gif" alt="Indoor Map App" class="wide" />
        <img src="assets/indoor_1.png" alt="Indoor Map detail" />
        <img src="assets/indoor_3.png" alt="Indoor Map detail" class="wide" />
        <img src="assets/indoor_4.gif" alt="Indoor Map animation" />
        <img src="assets/indoor_5.gif" alt="Indoor Map animation" />
        <img src="assets/map_management_portal.gif" alt="Map Management Portal" class="wide" />
        <img src="assets/management_1.png" alt="Map Management Portal detail" />
        <img src="assets/management_2.png" alt="Map Management Portal detail" />
        <img src="assets/management_3.png" alt="Map Management Portal detail" class="wide" />
        <img src="assets/management_5.png" alt="Map Management Portal detail" />
        <img src="assets/management_6.gif" alt="Map Management Portal animation" />
        <img src="assets/map_production_app.png" alt="Map Production App" class="wide" />
        <img src="assets/production_1.png" alt="Map Production detail" />
        <img src="assets/production_2.png" alt="Map Production detail" class="wide" />
        <img src="assets/production_4.png" alt="Map Production detail" />
        <img src="assets/production_6.png" alt="Map Production detail" />
        <img src="assets/production_7.png" alt="Map Production detail" />
        <img src="assets/production_8.gif" alt="Map Production animation" />
        <img src="assets/customer_journey_map.png" alt="Customer Journey Map" class="wide" />
        <img src="assets/journey_2.png" alt="Customer Journey detail" class="wide" />
        <img src="assets/mental_1.png" alt="Mental Health App detail" />
        <img src="assets/mental_2.png" alt="Mental Health App detail" />
        <img src="assets/retail_1.png" alt="Retail Mall App detail" />
        <img src="assets/retail_2.png" alt="Retail Mall App detail" class="wide" />
        <img src="assets/retail_3.png" alt="Retail Mall App detail" />
        <img src="assets/retail_4.gif" alt="Retail Mall App animation" />
      </div>
    </div>
  </body>
</html>
